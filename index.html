<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 Tycoon: Império dos Blocos</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --grid-bg: #16213e;
            --text-color: #e94560;
            --panel-bg: #0f3460;
            --accent: #4ecca3;
            --tile-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --grid-size: 4;
            --anim-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            /* Não aplicar touch-action globalmente para não travar o scroll da loja */
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: var(--tile-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- UI Header --- */
        #header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: var(--panel-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        #money-display {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }

        /* --- Game Board --- */
        #game-wrapper {
            position: relative;
            margin: 20px auto;
            padding: 10px;
            background: var(--grid-bg);
            border-radius: 8px;
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
            touch-action: none; /* Impede scroll da página ao jogar */
        }

        #grid-background {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            grid-template-rows: repeat(var(--grid-size), 1fr);
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            width: 100%;
            height: 100%;
        }

        /* Peças Animadas */
        .tile {
            position: absolute;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: all var(--anim-speed) ease-in-out;
            z-index: 2;
            box-sizing: border-box;
        }

        .tile-inner {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            animation: pop 0.2s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        /* Cores dos Blocos */
        .tile[data-value="2"] .tile-inner { background: #eee4da; color: #776e65; font-size: 2rem; }
        .tile[data-value="4"] .tile-inner { background: #ede0c8; color: #776e65; font-size: 2rem; }
        .tile[data-value="8"] .tile-inner { background: #f2b179; color: white; font-size: 2rem; }
        .tile[data-value="16"] .tile-inner { background: #f59563; color: white; font-size: 2rem; }
        .tile[data-value="32"] .tile-inner { background: #f67c5f; color: white; font-size: 2rem; }
        .tile[data-value="64"] .tile-inner { background: #f65e3b; color: white; font-size: 2rem; }
        .tile[data-value="128"] .tile-inner { background: #edcf72; color: white; font-size: 1.5rem; }
        .tile[data-value="256"] .tile-inner { background: #edcc61; color: white; font-size: 1.5rem; }
        .tile[data-value="512"] .tile-inner { background: #edc850; color: white; font-size: 1.5rem; }
        .tile[data-value="1024"] .tile-inner { background: #edc53f; color: white; font-size: 1.2rem; }
        .tile[data-value="2048"] .tile-inner { background: #edc22e; color: white; font-size: 1.2rem; box-shadow: 0 0 15px gold; }

        /* --- Floating Text --- */
        .floating-money {
            position: absolute;
            color: #4ecca3;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        /* --- Shop (scroll horizontal corrigido) --- */
        #shop {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--panel-bg);
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            padding: 12px 16px;
            gap: 12px;
            border-top: 2px solid var(--text-color);
            z-index: 20;
            touch-action: pan-x pinch-zoom; /* Permite rolagem horizontal suave no mobile */
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            display: flex;
            flex-wrap: nowrap;
        }

        /* Estilo da scrollbar (opcional) */
        #shop::-webkit-scrollbar {
            height: 4px;
        }
        #shop::-webkit-scrollbar-track {
            background: var(--grid-bg);
        }
        #shop::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        .shop-item {
            flex: 0 0 auto; /* Impede encolhimento */
            width: 150px;
            background: #16213e;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(78, 204, 163, 0.3);
            cursor: pointer;
            transition: transform 0.1s ease;
            margin-right: 10px;
        }

        .shop-item:active { transform: scale(0.96); }
        .shop-item.disabled { opacity: 0.5; filter: grayscale(1); cursor: default; pointer-events: none; }

        .shop-item h4 { font-size: 0.9rem; margin-bottom: 6px; color: #ddd; }
        .shop-item .price { font-weight: bold; color: var(--accent); font-size: 1rem; }
        .shop-item .level { font-size: 0.7rem; color: #e94560; margin-top: 4px; }

        /* Controles */
        #controls {
            margin: 10px auto 80px auto; /* Espaço inferior para não esconder atrás da shop */
            display: flex;
            gap: 20px;
            z-index: 5;
        }

        .btn-action {
            background: var(--text-color);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        #cooldown-bar {
            height: 4px;
            background: var(--accent);
            width: 0%;
            margin-top: 8px;
            transition: width linear;
        }

        .music-toggle {
            background: var(--accent);
            border: none;
            color: #1a1a2e;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header id="header">
        <h1>💰 2048 Tycoon</h1>
        <div id="money-display">$ 0</div>
        <button class="music-toggle" id="musicToggleBtn" onclick="toggleBackgroundMusic()">🎵 Música OFF</button>
    </header>

    <div id="game-wrapper">
        <div id="grid-background"></div>
        <div id="tile-container"></div>
    </div>

    <div id="controls">
        <button class="btn-action" onclick="resetGame()">Reiniciar Tudo</button>
    </div>

    <!-- Loja com scroll horizontal -->
    <div id="shop">
        <div class="shop-item" onclick="buyMinTile()">
            <h4>🔼 Valor Mínimo</h4>
            <div id="min-tile-price" class="price">$ 100</div>
            <div id="min-tile-level" class="level">Nível 0 (Min: 2)</div>
        </div>

        <div class="shop-item" id="organize-btn" onclick="buyOrganize()">
            <h4>🧹 Organização Snake</h4>
            <div id="organize-price" class="price">$ 500</div>
            <div class="level">Arrumar Peças (S)</div>
            <div id="cooldown-bar"></div>
        </div>

        <div class="shop-item" onclick="buyExpand()">
            <h4>📐 Expandir Grid</h4>
            <div id="expand-price" class="price">$ 2.000</div>
            <div id="expand-level" class="level">4x4</div>
        </div>

        <div class="shop-item" onclick="buyMultiplier()">
            <h4>⚡ Multiplicador</h4>
            <div id="mult-price" class="price">$ 150</div>
            <div id="mult-level" class="level">x1</div>
        </div>
        <!-- Adicione mais itens se quiser; o scroll será automático -->
    </div>

    <!-- Áudios -->
    <audio id="sfx-merge" src="https://actions.google.com/sounds/v1/water/air_squish_01.ogg"></audio>
    <audio id="sfx-cash" src="https://actions.google.com/sounds/v1/office/typing_fast.ogg"></audio>
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        let state = {
            money: 0,
            gridSize: 4,
            grid: [], 
            minTilePower: 1,
            multiplier: 1,
            prices: { minTile: 100, organize: 500, expand: 2000, mult: 150 },
            levels: { minTile: 0, expand: 1, mult: 1 },
            organizeCooldown: false,
            isAnimating: false,
            nextId: 0
        };

        const wrapper = document.getElementById('game-wrapper');
        const bgGrid = document.getElementById('grid-background');
        const tileContainer = document.getElementById('tile-container');
        const moneyEl = document.getElementById('money-display');
        let musicEnabled = false;
        const bgMusic = document.getElementById('bg-music');

        function init() {
            loadGame();
            setupGridUI();
            if (state.grid.length === 0 || state.grid.every(cell => cell === null)) {
                resetGrid();
            } else {
                renderGrid();
            }
            updateShopUI();
        }

        function setupGridUI() {
            document.documentElement.style.setProperty('--grid-size', state.gridSize);
            bgGrid.innerHTML = '';
            for (let i = 0; i < state.gridSize * state.gridSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('grid-cell');
                bgGrid.appendChild(cell);
            }
        }

        function resetGrid() {
            state.grid = Array(state.gridSize * state.gridSize).fill(null);
            addRandomTile();
            addRandomTile();
            renderGrid();
            saveGame();
        }

        function addRandomTile() {
            const emptyCells = state.grid.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
            if (emptyCells.length > 0) {
                const randomIdx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const power = Math.random() < 0.9 ? state.minTilePower : state.minTilePower + 1;
                state.grid[randomIdx] = { 
                    value: Math.pow(2, power), 
                    id: state.nextId++ 
                };
            }
        }

        function renderGrid() {
            const size = 100 / state.gridSize;
            const currentIds = state.grid.filter(t => t !== null).map(t => t.id);
            const tileElements = Array.from(tileContainer.children);

            tileElements.forEach(el => {
                if (!currentIds.includes(parseInt(el.dataset.id))) {
                    el.remove();
                }
            });

            state.grid.forEach((tile, index) => {
                if (tile !== null) {
                    let el = tileContainer.querySelector(`[data-id="${tile.id}"]`);
                    if (!el) {
                        el = document.createElement('div');
                        el.className = 'tile';
                        el.dataset.id = tile.id;
                        el.innerHTML = `<div class="tile-inner">${tile.value}</div>`;
                        tileContainer.appendChild(el);
                    }
                    
                    const row = Math.floor(index / state.gridSize);
                    const col = index % state.gridSize;
                    
                    el.style.width = `calc(${size}% - 10px)`;
                    el.style.height = `calc(${size}% - 10px)`;
                    el.style.top = `calc(${row * size}% + 5px)`;
                    el.style.left = `calc(${col * size}% + 5px)`;
                    el.setAttribute('data-value', tile.value);
                    el.querySelector('.tile-inner').innerText = tile.value;
                }
            });

            moneyEl.innerText = `$ ${Math.floor(state.money).toLocaleString()}`;
            updateShopUI();
        }

        async function move(direction) {
            if (state.isAnimating) return;
            
            const gridBefore = JSON.stringify(state.grid);
            const size = state.gridSize;

            const getLine = (i) => {
                let line = [];
                for (let j = 0; j < size; j++) {
                    if (direction === 'left' || direction === 'right') line.push(state.grid[i * size + j]);
                    else line.push(state.grid[i + j * size]);
                }
                return line;
            };

            const setLine = (i, line) => {
                for (let j = 0; j < size; j++) {
                    if (direction === 'left' || direction === 'right') state.grid[i * size + j] = line[j];
                    else state.grid[i + j * size] = line[j];
                }
            };

            for (let i = 0; i < size; i++) {
                let line = getLine(i);
                if (direction === 'right' || direction === 'down') line.reverse();

                let compressed = line.filter(t => t !== null);
                for (let j = 0; j < compressed.length - 1; j++) {
                    if (compressed[j].value === compressed[j+1].value) {
                        const newValue = compressed[j].value * 2;
                        compressed[j] = { value: newValue, id: compressed[j].id };
                        compressed.splice(j + 1, 1);
                        earnMoney(newValue);
                        playSFX('sfx-merge');
                    }
                }

                while (compressed.length < size) compressed.push(null);
                if (direction === 'right' || direction === 'down') compressed.reverse();
                setLine(i, compressed);
            }

            const gridAfter = JSON.stringify(state.grid);
            
            if (gridBefore !== gridAfter) {
                state.isAnimating = true;
                renderGrid();
                await new Promise(resolve => setTimeout(resolve, 300));
                addRandomTile();
                renderGrid();
                saveGame();
                state.isAnimating = false;
            }
        }

        function earnMoney(amount) {
            const total = amount * state.multiplier;
            state.money += total;
            showFloatingText(`+$${total}`);
            playSFX('sfx-cash');
        }

        function showFloatingText(text) {
            const el = document.createElement('div');
            el.className = 'floating-money';
            el.innerText = text;
            el.style.left = `${Math.random() * 60 + 20}%`;
            el.style.top = `40%`;
            wrapper.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function buyMinTile() {
            if (state.money >= state.prices.minTile) {
                state.money -= state.prices.minTile;
                state.minTilePower++;
                state.levels.minTile++;
                state.prices.minTile = Math.floor(state.prices.minTile * 2.5);
                state.grid = state.grid.map(t => (t !== null && t.value < Math.pow(2, state.minTilePower)) ? null : t);
                renderGrid();
                saveGame();
            }
        }

        function buyMultiplier() {
            if (state.money >= state.prices.mult) {
                state.money -= state.prices.mult;
                state.multiplier *= 2;
                state.levels.mult++;
                state.prices.mult = Math.floor(state.prices.mult * 3);
                renderGrid();
                saveGame();
            }
        }

        function buyExpand() {
            if (state.money >= state.prices.expand && state.gridSize < 8) {
                state.money -= state.prices.expand;
                const oldGrid = [...state.grid];
                const oldSize = state.gridSize;
                state.gridSize++;
                state.prices.expand = Math.floor(state.prices.expand * 5);
                state.grid = Array(state.gridSize * state.gridSize).fill(null);
                for(let r=0; r<oldSize; r++) {
                    for(let c=0; c<oldSize; c++) {
                        state.grid[r * state.gridSize + c] = oldGrid[r * oldSize + c];
                    }
                }
                setupGridUI();
                renderGrid();
                saveGame();
            }
        }

        async function buyOrganize() {
            if (state.organizeCooldown || state.isAnimating) return;
            if (state.money >= state.prices.organize) {
                state.money -= state.prices.organize;
                state.isAnimating = true;

                let tiles = state.grid.filter(t => t !== null).sort((a, b) => b.value - a.value);
                let newGrid = Array(state.gridSize * state.gridSize).fill(null);
                
                let tileIdx = 0;
                for (let r = 0; r < state.gridSize; r++) {
                    if (r % 2 === 0) {
                        for (let c = state.gridSize - 1; c >= 0; c--) {
                            if (tileIdx < tiles.length) newGrid[r * state.gridSize + c] = tiles[tileIdx++];
                        }
                    } else {
                        for (let c = 0; c < state.gridSize; c++) {
                            if (tileIdx < tiles.length) newGrid[r * state.gridSize + c] = tiles[tileIdx++];
                        }
                    }
                }

                state.grid = newGrid;
                renderGrid();

                state.organizeCooldown = true;
                const btn = document.getElementById('organize-btn');
                const bar = document.getElementById('cooldown-bar');
                btn.classList.add('disabled');
                
                bar.style.transition = 'none';
                bar.style.width = '0%';
                setTimeout(() => {
                    bar.style.transition = 'width 10s linear';
                    bar.style.width = '100%';
                }, 50);

                setTimeout(() => {
                    state.organizeCooldown = false;
                    btn.classList.remove('disabled');
                    bar.style.width = '0%';
                }, 10000);

                await new Promise(r => setTimeout(r, 300));
                state.isAnimating = false;
                saveGame();
            }
        }

        function updateShopUI() {
            document.getElementById('min-tile-price').innerText = `$ ${state.prices.minTile.toLocaleString()}`;
            document.getElementById('min-tile-level').innerText = `Nível ${state.levels.minTile} (Min: ${Math.pow(2, state.minTilePower)})`;
            document.getElementById('organize-price').innerText = `$ ${state.prices.organize.toLocaleString()}`;
            document.getElementById('expand-price').innerText = `$ ${state.prices.expand.toLocaleString()}`;
            document.getElementById('expand-level').innerText = `${state.gridSize}x${state.gridSize}`;
            document.getElementById('mult-price').innerText = `$ ${state.prices.mult.toLocaleString()}`;
            document.getElementById('mult-level').innerText = `x${state.multiplier}`;
        }

        function playSFX(id) {
            const sound = document.getElementById(id);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(() => {});
            }
        }

        function toggleBackgroundMusic() {
            const btn = document.getElementById('musicToggleBtn');
            if (!musicEnabled) {
                bgMusic.play().then(() => {
                    musicEnabled = true;
                    btn.innerText = '🎵 Música ON';
                    btn.style.background = '#e94560';
                    btn.style.color = 'white';
                }).catch(() => {
                    // Tenta novamente com interação
                    bgMusic.play().catch(() => {});
                    musicEnabled = true;
                    btn.innerText = '🎵 Música ON';
                });
            } else {
                bgMusic.pause();
                musicEnabled = false;
                btn.innerText = '🎵 Música OFF';
                btn.style.background = '#4ecca3';
                btn.style.color = '#1a1a2e';
            }
        }

        function saveGame() {
            localStorage.setItem('2048TycoonSave_final', JSON.stringify({
                ...state,
                isAnimating: false,
                organizeCooldown: false
            }));
        }

        function loadGame() {
            const saved = localStorage.getItem('2048TycoonSave_final');
            if (saved) {
                const loaded = JSON.parse(saved);
                state = { ...state, ...loaded };
                state.isAnimating = false;
                state.organizeCooldown = false;
            }
        }

        function resetGame() {
            if(confirm("Reiniciar todo o império?")) {
                localStorage.removeItem('2048TycoonSave_final');
                location.reload();
            }
        }

        // Eventos de teclado
        window.addEventListener('keydown', e => {
            if (e.key.includes('Arrow')) {
                e.preventDefault();
                move(e.key.replace('Arrow', '').toLowerCase());
            }
        });

        // Touch para o jogo (apenas na área do game-wrapper)
        let tsX, tsY;
        wrapper.addEventListener('touchstart', e => {
            e.preventDefault(); // necessário para evitar scroll da página
            tsX = e.touches[0].clientX;
            tsY = e.touches[0].clientY;
        });
        wrapper.addEventListener('touchend', e => {
            e.preventDefault();
            const dx = e.changedTouches[0].clientX - tsX;
            const dy = e.changedTouches[0].clientY - tsY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 20) move(dx > 0 ? 'right' : 'left');
            } else {
                if (Math.abs(dy) > 20) move(dy > 0 ? 'down' : 'up');
            }
        });

        init();
    </script>
</body>
</html>
